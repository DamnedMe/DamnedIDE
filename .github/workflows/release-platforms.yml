name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild, or leave empty to create a patch release
        required: false
        type: string
      source_ref:
        description: Ref to build for a manual release
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TAG_INPUT" ]; then
            echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            echo "source_ref=${SOURCE_REF_INPUT:-main}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm version patch --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "chore: release $tag"
          git push origin HEAD:main
          git tag "$tag"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$tag" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Arch packaging tools
        # fpm builds the pacman package with bsdtar, which is not on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --config electron-builder.yml --linux AppImage deb pacman --publish always

  build-macos:
    needs: [prepare-release, build-linux]
    runs-on: macos-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish macOS packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --config electron-builder.yml --mac dmg zip --publish always

  build-windows:
    needs: [prepare-release, build-macos]
    runs-on: windows-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --config electron-builder.yml --win nsis --publish always

  publish-release:
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success'
    needs:
      - prepare-release
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          test -n "$release_id"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false \
            -F prerelease=false
