appId: com.damned.ide
productName: DamnedIDE
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/icon.ico
  - resources/icon.png
publish:
  provider: github
  owner: DamnedMe
  repo: DamnedIDE
win:
  target:
    - nsis
  icon: resources/icon.ico
asarUnpack:
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*"
  - "**/*.node"
  - "**/*.dll"
# node-pty has no prebuilt for electron ABI 119 and source builds fail on Windows;
# dev and packaged run the same Electron 28, so reuse the compiled binaries as-is
npmRebuild: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
linux:
  target:
    - AppImage
    - deb
    - pacman
  icon: resources/icon.png
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
