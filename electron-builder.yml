appId: com.damned.ide
productName: DamnedIDE
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/icon.ico
  - resources/icon.png
# afterPack hook: labels the package for electron-updater (only when the
# DAMNED_PACKAGE_TYPE env var is set — used for the pacman-only build)
afterPack: scripts/after-pack.cjs
publish:
  provider: github
  owner: DamnedMe
  repo: DamnedIDE
win:
  target:
    - nsis
  icon: resources/icon.ico
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
asarUnpack:
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*"
  - "**/*.node"
  - "**/*.dll"
# node-pty has no prebuilt for electron ABI 119 and source builds fail on Windows;
# dev and packaged run the same Electron 28, so reuse the compiled binaries as-is
npmRebuild: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  include: resources/installer.nsh
linux:
  target:
    - AppImage
    - deb
    - pacman
  icon: resources/icon.png
# electron-builder derives the pacman dependencies from the ELF NEEDED entries,
# which yields names that do not exist in the Arch repositories (http-parser,
# libappindicator-gtk3, re2, snappy, libvpx, ffmpeg...). This is the Arch-valid
# set (same intent as the curated .deb depends).
pacman:
  depends:
    - c-ares
    - gtk3
    - libevent
    - libnotify
    - libsecret
    - libxslt
    - libxss
    - libxtst
    - minizip
    - nss
    - at-spi2-core
    - util-linux-libs
    - xdg-utils
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
