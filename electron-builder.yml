appId: com.damned.ide
productName: DamnedIDE
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/icon.ico
  - resources/icon.png
  - "!node_modules/**/*"
publish:
  provider: github
  owner: DamnedMe
  repo: DamnedIDE
win:
  target:
    - nsis
  icon: resources/icon.ico
asarUnpack:
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*"
  - "**/*.node"
  - "**/*.dll"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
mac:
  target:
    - dmg
  icon: resources/icon.png
